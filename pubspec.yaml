name: ride_sensor_capture
description: "Multi-device BLE sensor data collection app with voice-triggered recording for ML training"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Phase 1 required dependencies:
  flutter_blue_plus: ^1.36.0
  drift: ^2.29.0
  sqlite3: ^2.5.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.70.2
  dio: ^5.8.0+1
  geolocator: ^13.0.4
  speech_to_text: ^7.3.0
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^6.0.0
  battery_plus: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/

